<div class="landing-container">
  <div class="landing-decor-top">
    <div class="stage-strings-svg">
      <svg viewBox="0 0 400 60" preserveAspectRatio="none">
        <path d="M 20 0 L 20 50 M 100 0 L 100 35 M 200 0 L 200 60 M 300 0 L 300 40 M 380 0 L 380 52" stroke="rgba(201,162,39,0.3)" stroke-width="1" stroke-dasharray="2 3"/>
      </svg>
    </div>
  </div>

  <div class="logo-area">
    <div class="logo-seal-container">
      <div class="logo-seal-pulse"></div>
      <div class="logo-symbol">𝕸</div>
    </div>
    <div class="logo-ornament-row">
      <span class="ornament-wing">── ❦ ──</span>
      <span class="logo-badge" data-i18n="gothic_tag">Gölge Oyunu</span>
      <span class="ornament-wing">── ❦ ──</span>
    </div>
    <h1 class="logo-title">Mr. Schadenfreude</h1>
    <p class="logo-subtitle" data-i18n="lore_quote">"İpler gerildi. Perde açılıyor."</p>
  </div>

  <div class="landing-actions-bar">
    <div class="lang-selector-wrap">
      <span class="lang-icon">🌐</span>
      <select id="lang-select" class="lang-select" onchange="changeLanguage(this.value)">
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="en">EN English</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="es">🇪🇸 Español</option>
        <option value="fr">🇫🇷 Français</option>
      </select>
    </div>

    <button class="landing-grimoire-trigger" onclick="openGrimoire()">
      <span>📜</span>
      <span data-i18n="view_grimoire_btn">Grimoire</span>
    </button>
  </div>

  <div class="card landing-card">
    <div class="card-corner tl">✦</div>
    <div class="card-corner tr">✦</div>
    <div class="card-corner bl">✦</div>
    <div class="card-corner br">✦</div>

    <div class="tab-bar">
      <button class="tab-btn active" id="tab-create" onclick="switchTab('create')">
        <span class="tab-icon">🏰</span>
        <span data-i18n="create_room">Lobi Kur</span>
      </button>
      <button class="tab-btn" id="tab-join" onclick="switchTab('join')">
        <span class="tab-icon">🗝️</span>
        <span data-i18n="join_room">Lobiye Gir</span>
      </button>
    </div>

    <!-- Create Room Tab -->
    <div id="tab-create-content" class="tab-content active">
      <div class="form-group">
        <label for="create-name">
          <span class="label-flourish">𝔑</span> <span data-i18n="enter_name">Takma Adın</span>
        </label>
        <div class="input-wrapper">
          <input id="create-name" type="text" maxlength="20" placeholder="Köydeki adın..." data-i18n-placeholder="enter_name" autocomplete="off" />
          <span class="input-focus-line"></span>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-create" onclick="createRoom()">
        <span class="btn-shine"></span>
        <span data-i18n="create_room">Lobi Kur</span>
      </button>
    </div>

    <!-- Join Room Tab -->
    <div id="tab-join-content" class="tab-content">
      <div class="form-group">
        <label for="join-name">
          <span class="label-flourish">𝔑</span> <span data-i18n="enter_name">Takma Adın</span>
        </label>
        <div class="input-wrapper">
          <input id="join-name" type="text" maxlength="20" placeholder="Köydeki adın..." data-i18n-placeholder="enter_name" autocomplete="off" />
          <span class="input-focus-line"></span>
        </div>
      </div>
      <div class="form-group">
        <label for="join-code">
          <span class="label-flourish">ℭ</span> <span data-i18n="room_code">Oda Kodu</span>
        </label>
        <div class="input-wrapper">
          <input id="join-code" type="text" maxlength="8" placeholder="SCH-XXX" data-i18n-placeholder="enter_code" autocomplete="off" style="text-transform:uppercase" />
          <span class="input-focus-line"></span>
        </div>
      </div>
      <button class="btn btn-primary" id="btn-join" onclick="joinRoom()">
        <span class="btn-shine"></span>
        <span data-i18n="join_room">Lobiye Gir</span>
      </button>
    </div>

    <div id="landing-error" class="error-msg"></div>
  </div>

  <!-- Role Showcase Teaser Bar -->
  <div class="roles-teaser-strip">
    <div class="teaser-item" title="Mr. Schadenfreude" onclick="openGrimoire('roles')">
      <span class="teaser-icon">🎩</span>
      <span class="teaser-name">Mr. Schadenfreude</span>
    </div>
    <div class="teaser-item" title="Kukla" onclick="openGrimoire('roles')">
      <span class="teaser-icon">🪆</span>
      <span class="teaser-name">Kukla</span>
    </div>
    <div class="teaser-item" title="Mortisyen" onclick="openGrimoire('roles')">
      <span class="teaser-icon">⚰️</span>
      <span class="teaser-name">Mortisyen</span>
    </div>
    <div class="teaser-item" title="Rahibe" onclick="openGrimoire('roles')">
      <span class="teaser-icon">🕯️</span>
      <span class="teaser-name">Rahibe</span>
    </div>
    <div class="teaser-item" title="Şövalye" onclick="openGrimoire('roles')">
      <span class="teaser-icon">⚔️</span>
      <span class="teaser-name">Şövalye</span>
    </div>
    <div class="teaser-item" title="Madman" onclick="openGrimoire('roles')">
      <span class="teaser-icon">🌀</span>
      <span class="teaser-name">Madman</span>
    </div>
    <div class="teaser-item" title="Köylü" onclick="openGrimoire('roles')">
      <span class="teaser-icon">🌾</span>
      <span class="teaser-name">Köylü</span>
    </div>
  </div>
</div>
